services:
  db:
    image: postgres:17-alpine
    container_name: torneos-db
    environment:
      POSTGRES_USER: torneos
      POSTGRES_PASSWORD: torneos
      POSTGRES_DB: torneos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torneos -d torneos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
