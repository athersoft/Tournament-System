name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: torneos
          POSTGRES_PASSWORD: torneos
          POSTGRES_DB: torneos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torneos -d torneos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://torneos:torneos@localhost:5432/torneos_test
      TEST_DATABASE_URL: postgresql+asyncpg://torneos:torneos@localhost:5432/torneos_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Migraciones (aplicar y verificar que no falten)
        run: |
          alembic upgrade head
          alembic check

      - name: Pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml
